# ArtiosCAD R12 regression: hop tay gai / nap gai (99 model-space entities).
#
# Companion to artioscad-hop-cung.yaml — see that file for run instructions.
# This drawing rendered exactly 1 of 99 entities under the render-path
# regression; the assertion below fails until every entity reaches the scene.

url: ${MAESTRO_BASE_URL}/?fixture=/e2e/artioscad-hop-tay-gai-nap-gai.dxf&minInk=500
env:
  MAESTRO_BASE_URL: "http://192.168.64.1:5273"
---
- launchApp:
    clearState: true
- assertVisible:
    text: ".*e2e: file=artioscad-hop-tay-gai-nap-gai\\.dxf.*"
- assertVisible:
    text: ".*entities=99 pending=false.*"
- assertVisible:
    text: ".*inkOK=true.*"
